<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex006</title>
    <style>
        #area {
            font: normal 20pt Arial;
            background: #6587b3;
            color: #e6afff;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id = "area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        Interaja...
    </div>

    <script>

        //eventos DOM

        //var change = window.documente.getElementById('area')
        // var change = window.document.querySelector('div#area')
        
        //change.addEventListener('click', clicar)
        //change.addEventListener('mouseenter', entrar)
        //change.addEventListener('mouseout', sair)

        function clicar() {
            var change = window.document.getElementById('area')
            change.innerText = 'Clicou!'
            change.style.color = '#6587b3'
            change.style.background = '#e6afff'
        }

        function entrar() {
            var change = window.document.querySelector('div#area')
            change.innerText = 'Clica em mim'
        }

        function sair() {
            var change = window.document.getElementById('area')
            change.innerText = 'Interaja...'
            change.style.color = '#e6afff' 
            change.style.background ='#6587b3'
        }

    </script>
</body>
</html>
